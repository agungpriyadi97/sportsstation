image:
  name: 'katalonstudio/katalon:11.1.1'
  entrypoint: [""]

stages:
  - test

variables:
  CONTINUE_ON_FAILURE: "true"

katalon_Sportstation_test:
  stage: test
  tags:
    - infra
  timeout: 12h  
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  
  script:
    - curl ifconfig.me
    - |
      # --- DYNAMIC PATH RESOLUTION ---
      if [ -z "$TEST_PATH" ]; then
        echo "Running default Sportsstation Regression Collection..."
        export FINAL_PATH="Test Suites/Regression/Regression_sportstation_Test"
        export ARG_TYPE="-testSuiteCollectionPath"
      else
        echo "Running custom test: $TEST_PATH"
        export FINAL_PATH=$(echo "$TEST_PATH" | cut -d'=' -f2)
        export ARG_TYPE=$(echo "$TEST_PATH" | cut -d'=' -f1)
      fi

      # --- SEQUENTIAL EXECUTION (Chrome & Firefox Only) ---
      
      echo "Starting Execution 1/2: Chrome (Headless)..."
      katalonc.sh -noSplash -runMode=console \
        -projectPath="$CI_PROJECT_DIR/Sportstation.prj" \
        -retry=0 -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Chrome (headless)" \
        --config -webui.autoUpdateDrivers=true || echo "Chrome tests completed with some failures."

      echo "Starting Execution 2/2: Firefox (Headless)..."
      katalonc.sh -noSplash -runMode=console \
        -projectPath="$CI_PROJECT_DIR/Sportstation.prj" \
        -retry=0 -apiKey="$KATALON_API_KEY" \
        "$ARG_TYPE=$FINAL_PATH" \
        -browserType="Firefox (headless)" \
        --config -webui.autoUpdateDrivers=true || echo "Firefox tests completed with some failures."

    # --- ARTIFACT PURGE ---
    - echo "Cleaning up historical cache from runner workspace..."
    - find Reports/ -type f -name "*.mp4" -mtime +30 -exec rm -f {} \; || true
    - find Reports/ -type f ! -name "*.html" ! -name "*.xml" ! -name "*.csv" ! -name "*.mp4" ! -name "*.srt" -mtime +60 -exec rm -f {} \; || true

  artifacts:
    when: always
    paths:
      - Reports/
    expire_in: 2 mos